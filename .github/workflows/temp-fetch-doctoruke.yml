name: Temporary Doctor Uke audio fetch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-temp-doctoruke-audio-20260730

      - name: Download verified MP3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p doctoruke_fetch
          python3 - <<'PY'
          import urllib.request

          page_url = 'https://www.doctoruke.com/_player/tellher.html'
          audio_url = 'https://www.doctoruke.com/_player/_songs/tellher.mp3'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Referer': page_url,
          }
          request = urllib.request.Request(audio_url, headers=headers)
          with urllib.request.urlopen(request, timeout=90) as response:
              data = response.read()
              final_url = response.geturl()
              content_type = response.headers.get_content_type()
          if len(data) < 10000:
              raise RuntimeError(f'Audio file unexpectedly small: {len(data)} bytes')
          open('doctoruke_fetch/tellher.mp3', 'wb').write(data)
          open('doctoruke_fetch/source.txt', 'w', encoding='utf-8').write(
              f'Player page: {page_url}\nMP3 source: {final_url}\nBytes: {len(data)}\nContent-Type: {content_type}\n'
          )
          print(f'Downloaded {len(data)} bytes from {final_url}')
          PY

      - name: Upload MP3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: doctoruke-tellher-mp3
          path: |
            doctoruke_fetch/tellher.mp3
            doctoruke_fetch/source.txt
          if-no-files-found: error
          retention-days: 1
