name: Temporary Doctor Uke audio fetch

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-temp-doctoruke-audio-20260730

      - name: Fetch player page and inspect media references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p doctoruke_fetch
          python3 - <<'PY'
          import re
          import urllib.request
          from urllib.parse import urljoin

          page_url = 'https://www.doctoruke.com/_player/tellher.html'
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Referer': 'https://www.doctoruke.com/songs.html',
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=45) as response:
                  return response.read(), response.geturl(), response.headers.get_content_type()

          html_bytes, final_page_url, content_type = fetch(page_url)
          html = html_bytes.decode('utf-8', errors='replace')
          open('doctoruke_fetch/page.html', 'wb').write(html_bytes)

          urls = []
          for value in re.findall(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', html, flags=re.I):
              urls.append(urljoin(final_page_url, value))
          for value in re.findall(r'''["']([^"']+\.(?:mp3|m4a|ogg|wav|aac)(?:\?[^"']*)?)["']''', html, flags=re.I):
              urls.append(urljoin(final_page_url, value))

          unique = []
          for value in urls:
              if value not in unique:
                  unique.append(value)

          with open('doctoruke_fetch/page-info.txt', 'w', encoding='utf-8') as handle:
              handle.write(f'Player page: {final_page_url}\nContent-Type: {content_type}\nBytes: {len(html_bytes)}\n\nReferences:\n')
              handle.write('\n'.join(unique))

          media_candidates = [u for u in unique if re.search(r'\.(mp3|m4a|ogg|wav|aac)(?:\?|$)', u, flags=re.I)]
          for audio_url in media_candidates:
              try:
                  audio_bytes, final_audio_url, audio_type = fetch(audio_url)
                  if len(audio_bytes) < 10000:
                      continue
                  open('doctoruke_fetch/tellher.mp3', 'wb').write(audio_bytes)
                  with open('doctoruke_fetch/source.txt', 'w', encoding='utf-8') as handle:
                      handle.write(f'Player page: {final_page_url}\nMedia source: {final_audio_url}\nBytes: {len(audio_bytes)}\nContent-Type: {audio_type}\n')
                  break
              except Exception:
                  pass
          PY

      - name: Commit inspection files to temporary branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doctoruke_fetch/
          git commit -m 'Temporary inspect Doctor Uke player page' || exit 0
          git push origin HEAD:chatgpt-temp-doctoruke-audio-20260730
